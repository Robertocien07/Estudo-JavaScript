<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <!-- Link para o CSS (vamos usar na próxima etapa) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Minhas Tarefas</h1>
      <p>Organize seu dia de forma simples.</p>
    </header>

    <main>
      <!-- Formulário para adicionar nova tarefa -->
      <form id="form-tarefa">
        <input type="text" id="input-tarefa" placeholder="O que precisa ser feito?" required>
        <button type="submit" id="btn-adicionar">Adicionar</button>
      </form>

      <!-- Lista onde as tarefas vão aparecer -->
      <ul id="lista-tarefas">
        <!-- O JavaScript vai inserir as tarefas aqui dentro -->
      </ul>
    </main>
  </div>

  <!-- Link para o JavaScript (vamos usar na etapa 3) -->
  <script src="app.js"></script>
</body>
</html>
