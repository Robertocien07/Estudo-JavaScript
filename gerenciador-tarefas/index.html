<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
    <!-- Favicon usando emoji em SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
  <!-- Link para o CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Minhas Tarefas</h1>
      <p>Organize seu dia de forma simples.</p>
    </header>

    <main>
      <!-- Formulário para adicionar nova tarefa -->
      <form id="form-tarefa">
        <input type="text" id="input-tarefa" placeholder="O que precisa ser feito?" required>
        <button type="submit" id="btn-adicionar">Adicionar</button>
      </form>

      <!-- Lista onde as tarefas vão aparecer -->
      <ul id="lista-tarefas">
        <!-- O JavaScript vai inserir as tarefas aqui dentro -->
      </ul>
    </main>
  </div>

  <!-- NOVO: Rodapé com os créditos -->
  <footer>
    <p>Desenvolvido com 💙 por <a href="https://github.com/Robertocien07" target="_blank">Roberto Donato</a></p>
  </footer>

  <!-- Link para o JavaScript -->
  <script src="app.js"></script>
</body>
</html>
